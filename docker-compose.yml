services:
  db:
    image: postgres:16-alpine
    container_name: meeple-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meeple}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meeple}
      POSTGRES_DB: ${POSTGRES_DB:-meeple}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meeple} -d ${POSTGRES_DB:-meeple}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
